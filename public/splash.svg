<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1a35"/>
      <stop offset="100%" stop-color="#0a0e1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c060" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f0c060" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="22" cy="18" r="0.8"/>
    <circle cx="55" cy="30" r="0.6"/>
    <circle cx="80" cy="14" r="1.0"/>
    <circle cx="130" cy="22" r="0.7"/>
    <circle cx="165" cy="12" r="0.9"/>
    <circle cx="188" cy="38" r="0.6"/>
    <circle cx="15" cy="90" r="0.8"/>
    <circle cx="185" cy="80" r="0.9"/>
    <circle cx="12" cy="155" r="0.7"/>
    <circle cx="190" cy="145" r="0.8"/>
    <circle cx="40" cy="185" r="0.9"/>
    <circle cx="170" cy="180" r="0.6"/>
  </g>
  <g fill="#f0c060" opacity="0.5">
    <circle cx="35" cy="55" r="0.8"/>
    <circle cx="162" cy="45" r="0.9"/>
    <circle cx="20" cy="130" r="0.8"/>
    <circle cx="180" cy="120" r="0.9"/>
  </g>

  <!-- Glow -->
  <ellipse cx="100" cy="100" rx="65" ry="60" fill="url(#glow)"/>

  <!-- Envelope -->
  <g filter="url(#soft-glow)">
    <rect x="48" y="68" width="104" height="72" rx="5" fill="none" stroke="#f0c060" stroke-width="2.5" opacity="0.9"/>
    <rect x="48" y="68" width="104" height="72" rx="5" fill="#f0c060" fill-opacity="0.06"/>
    <polyline points="48,68 100,112 152,68" fill="none" stroke="#f0c060" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
    <line x1="48" y1="140" x2="84" y2="106" stroke="#f0c060" stroke-width="1.5" opacity="0.5"/>
    <line x1="152" y1="140" x2="116" y2="106" stroke="#f0c060" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Wax seal -->
  <circle cx="100" cy="126" r="6" fill="#f0c060" opacity="0.7"/>
  <circle cx="100" cy="126" r="3.5" fill="#0a0e1f" opacity="0.8"/>
</svg>
