<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-hero" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0f1a35"/>
      <stop offset="100%" stop-color="#0a0e1f"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f0c060" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0c060" stop-opacity="0"/>
    </radialGradient>
    <filter id="title-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="env-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-hero)"/>
  <rect width="1200" height="630" fill="url(#center-glow)"/>

  <!-- Stars — scattered throughout -->
  <g fill="#ffffff">
    <circle cx="45" cy="35" r="1.5" opacity="0.7"/>
    <circle cx="120" cy="80" r="1.0" opacity="0.5"/>
    <circle cx="200" cy="25" r="2.0" opacity="0.6"/>
    <circle cx="310" cy="55" r="1.2" opacity="0.7"/>
    <circle cx="440" cy="30" r="1.8" opacity="0.5"/>
    <circle cx="580" cy="45" r="1.0" opacity="0.7"/>
    <circle cx="700" cy="20" r="1.5" opacity="0.6"/>
    <circle cx="820" cy="65" r="2.0" opacity="0.5"/>
    <circle cx="950" cy="35" r="1.2" opacity="0.7"/>
    <circle cx="1060" cy="55" r="1.8" opacity="0.6"/>
    <circle cx="1150" cy="28" r="1.5" opacity="0.5"/>
    <circle cx="30" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="90" cy="250" r="1.8" opacity="0.4"/>
    <circle cx="55" cy="380" r="1.5" opacity="0.6"/>
    <circle cx="20" cy="490" r="1.2" opacity="0.5"/>
    <circle cx="70" cy="580" r="1.8" opacity="0.7"/>
    <circle cx="1170" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="1140" cy="280" r="1.2" opacity="0.4"/>
    <circle cx="1180" cy="400" r="1.8" opacity="0.6"/>
    <circle cx="1110" cy="530" r="1.5" opacity="0.5"/>
    <circle cx="160" cy="580" r="1.2" opacity="0.7"/>
    <circle cx="340" cy="600" r="1.8" opacity="0.5"/>
    <circle cx="520" cy="590" r="1.5" opacity="0.6"/>
    <circle cx="700" cy="610" r="1.2" opacity="0.7"/>
    <circle cx="880" cy="595" r="1.8" opacity="0.5"/>
    <circle cx="1050" cy="605" r="1.5" opacity="0.6"/>
    <circle cx="240" cy="130" r="1.0" opacity="0.5"/>
    <circle cx="760" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="990" cy="140" r="1.2" opacity="0.4"/>
  </g>
  <!-- Gold accent stars -->
  <g fill="#f0c060" opacity="0.55">
    <circle cx="160" cy="48" r="1.8"/>
    <circle cx="480" cy="70" r="2.2"/>
    <circle cx="730" cy="38" r="1.8"/>
    <circle cx="1000" cy="60" r="2.2"/>
    <circle cx="40" cy="300" r="1.8"/>
    <circle cx="1160" cy="320" r="2.2"/>
    <circle cx="100" cy="520" r="1.8"/>
    <circle cx="1100" cy="480" r="2.2"/>
    <circle cx="280" cy="605" r="1.8"/>
    <circle cx="940" cy="615" r="2.2"/>
  </g>

  <!-- Envelope icon (left of center) -->
  <g transform="translate(195, 230)" filter="url(#env-glow)" opacity="0.85">
    <rect x="0" y="0" width="130" height="90" rx="6" fill="none" stroke="#f0c060" stroke-width="3"/>
    <rect x="0" y="0" width="130" height="90" rx="6" fill="#f0c060" fill-opacity="0.05"/>
    <polyline points="0,0 65,58 130,0" fill="none" stroke="#f0c060" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="90" x2="44" y2="46" stroke="#f0c060" stroke-width="2" opacity="0.5"/>
    <line x1="130" y1="90" x2="86" y2="46" stroke="#f0c060" stroke-width="2" opacity="0.5"/>
    <circle cx="65" cy="68" r="7" fill="#f0c060" opacity="0.6"/>
    <circle cx="65" cy="68" r="4" fill="#0a0e1f" opacity="0.8"/>
  </g>

  <!-- Main title -->
  <text
    x="600"
    y="248"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="76"
    font-weight="normal"
    fill="#f0c060"
    filter="url(#title-glow)"
    letter-spacing="2"
  >Letters to the Future</text>

  <!-- Decorative line under title -->
  <line x1="340" y1="278" x2="860" y2="278" stroke="#f0c060" stroke-width="1" opacity="0.3"/>

  <!-- Tagline -->
  <text
    x="600"
    y="336"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="28"
    fill="#f0ece4"
    opacity="0.7"
  >Messages for the unknown future</text>

  <!-- Sub-tagline -->
  <text
    x="600"
    y="392"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    fill="#f0c060"
    opacity="0.5"
  >Permanent · On-chain · Base Mainnet</text>

  <!-- Decorative dots -->
  <g fill="#f0c060" opacity="0.4">
    <circle cx="540" cy="392" r="3"/>
    <circle cx="660" cy="392" r="3"/>
  </g>

  <!-- Bottom decorative stars row -->
  <g fill="#f0c060" opacity="0.3">
    <circle cx="470" cy="450" r="2"/>
    <circle cx="510" cy="460" r="1.5"/>
    <circle cx="550" cy="448" r="2.5"/>
    <circle cx="590" cy="456" r="1.5"/>
    <circle cx="630" cy="445" r="2"/>
    <circle cx="670" cy="458" r="1.5"/>
    <circle cx="710" cy="450" r="2"/>
    <circle cx="750" cy="462" r="1"/>
  </g>
</svg>
